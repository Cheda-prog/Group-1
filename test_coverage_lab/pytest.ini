[pytest]
# --cov=tests is intentional: the coverage report shows the tests/ rows so
# students can see their own test file being exercised.
#
# Note: coverage.py does not read configuration from pytest.ini. Any coverage
# settings beyond these command-line flags belong in .coveragerc, setup.cfg,
# tox.ini, or pyproject.toml.
addopts = --verbose --cov=models --cov=tests --cov-report=term-missing
